<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MeAPI DM – Admin</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mut:#6b6b70; --line:#e7e5e0; --acc:#5b4bff; --ok:#11845b; --bad:#c2352b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:24px; padding:14px 28px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; }
  header b { font-size:16px; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--mut); font:inherit; }
  nav button.on { background:#efedff; color:var(--acc); font-weight:600; }
  main { padding:24px 28px; max-width:1200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .n { font-size:26px; font-weight:650; } .stat .l { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mut); font-weight:600; background:#faf9f7; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#faf9ff; }
  input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { width:100%; min-height:70px; }
  button.b { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.d { color:var(--bad); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:#eee; }
  .pill.paid { background:#e3f6ee; color:var(--ok); } .pill.ban { background:#fde8e6; color:var(--bad); }
  h2 { font-size:18px; margin:0 0 14px; } h3 { font-size:14px; margin:20px 0 8px; }
  .form { display:grid; grid-template-columns:160px 1fr; gap:8px 12px; align-items:center; max-width:720px; }
  #login { max-width:380px; margin:12vh auto; }
  .muted { color:var(--mut); }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h2>MeAPI DM admin</h2>
  <p class="muted">Paste the ADMIN_TOKEN from the server's .env.</p>
  <div class="row"><input id="tok" type="password" style="flex:1" placeholder="Admin token" /><button class="b p" id="go">Sign in</button></div>
</div>
<div id="shell" hidden>
  <header><b>MeAPI DM · Admin</b>
    <nav id="nav"></nav>
    <span style="flex:1"></span><button class="b" id="logout">Sign out</button>
  </header>
  <main id="view"></main>
</div>
<script>
(() => {
  const TABS = ['Dashboard', 'Licenses', 'Products', 'Notices', 'Settings', 'Payments'];
  let tab = 'Dashboard';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const dt = (ms) => ms ? new Date(ms).toLocaleString() : '—';
  const rupees = (p) => '₹' + (p / 100).toLocaleString('en-IN');

  async function api(method, path, body) {
    const r = await fetch('/admin/api' + path, {
      method, headers: { Authorization: 'Bearer ' + localStorage.getItem('mdm_admin'), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) { localStorage.removeItem('mdm_admin'); boot(); throw new Error('unauthorized'); }
    return r.json();
  }

  function boot() {
    const has = !!localStorage.getItem('mdm_admin');
    $('#login').hidden = has; $('#shell').hidden = !has;
    if (has) render();
  }
  $('#go').onclick = () => { localStorage.setItem('mdm_admin', $('#tok').value.trim()); boot(); };
  $('#logout').onclick = () => { localStorage.removeItem('mdm_admin'); boot(); };

  function render() {
    $('#nav').innerHTML = TABS.map((t) => `<button class="${t === tab ? 'on' : ''}" data-t="${t}">${t}</button>`).join('');
    $('#nav').querySelectorAll('button').forEach((b) => (b.onclick = () => { tab = b.dataset.t; render(); }));
    ({ Dashboard, Licenses, Products, Notices, Settings, Payments })[tab]();
  }

  async function Dashboard() {
    const s = await api('GET', '/stats');
    const stat = (n, l) => `<div class="card stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
    $('#view').innerHTML = `<h2>Overview</h2><div class="grid">
      ${stat(s.licenses, 'Installs')}${stat(s.newToday, 'New today')}${stat(s.active7d, 'Active 7 days')}
      ${stat(s.accounts, 'Google accounts')}${stat(s.paidNow, 'Paying now')}${stat(s.sendsToday, 'DMs today')}
      ${stat(rupees(s.revenue30dPaise), 'Revenue 30 days')}</div>
      <h3>DMs per day</h3><table><tr><th>Day</th><th>DMs</th></tr>${s.sendsByDay.map((d) => `<tr><td>${d.day}</td><td>${d.n}</td></tr>`).join('') || '<tr><td colspan=2 class=muted>No data yet</td></tr>'}</table>
      <h3>Events (7 days)</h3><table><tr><th>Event</th><th>Count</th></tr>${s.events7d.map((e) => `<tr><td class="mono">${esc(e.name)}</td><td>${e.n}</td></tr>`).join('') || '<tr><td colspan=2 class=muted>No events yet</td></tr>'}</table>`;
  }

  async function Licenses(q = '') {
    const d = await api('GET', '/licenses?q=' + encodeURIComponent(q));
    $('#view').innerHTML = `<h2>Licenses</h2>
      <div class="row"><input id="q" placeholder="Search key or email" value="${esc(q)}" style="width:320px"/><button class="b" id="qs">Search</button></div>
      <table><tr><th>Key</th><th>Email</th><th>Plan</th><th>Today</th><th>Version</th><th>Last seen</th></tr>
      ${d.licenses.map((l) => `<tr class="click" data-k="${esc(l.key)}"><td class="mono">${esc(l.key.slice(0, 16))}…</td><td>${esc(l.email || '—')}</td>
        <td>${l.banned ? '<span class="pill ban">banned</span>' : l.paid_until ? `<span class="pill paid">paid → ${new Date(l.paid_until).toLocaleDateString()}</span>` : '<span class="pill">free</span>'}</td>
        <td>${l.today || 0}</td><td>${esc(l.version || '—')}</td><td>${dt(l.last_seen_at)}</td></tr>`).join('')}</table>`;
    $('#qs').onclick = () => Licenses($('#q').value);
    $('#q').onkeydown = (e) => { if (e.key === 'Enter') Licenses($('#q').value); };
    document.querySelectorAll('tr.click').forEach((tr) => (tr.onclick = () => License(tr.dataset.k)));
  }

  async function License(key) {
    const d = await api('GET', '/licenses/' + key);
    const l = d.license, e = d.entitlement;
    $('#view').innerHTML = `<div class="row"><button class="b" id="back">← Back</button></div>
      <h2 class="mono">${esc(l.key)}</h2>
      <div class="grid"><div class="card stat"><div class="n">${e.tier}</div><div class="l">${e.paidBy || 'plan'}</div></div>
        <div class="card stat"><div class="n">${e.usageToday}</div><div class="l">DMs today</div></div>
        <div class="card stat"><div class="n">${esc(e.account?.email || '—')}</div><div class="l">Account</div></div></div>
      <h3>Grant access</h3>
      <div class="row"><select id="gk"><option value="pro">PRO</option><option value="pass">Pass</option></select>
        <input id="gh" type="number" value="720" style="width:110px"/> hours <button class="b p" id="grant">Grant</button>
        <button class="b" id="reset">Reset today's usage</button>
        <button class="b d" id="ban">${l.banned ? 'Unban' : 'Ban'}</button></div>
      <h3>Entitlements</h3><table><tr><th>ID</th><th>Kind</th><th>Source</th><th>Ref</th><th>Ends</th><th></th></tr>
      ${d.entitlements.map((x) => `<tr><td>${x.id}</td><td>${x.kind}</td><td>${x.source}</td><td class="mono">${esc(x.ref || '')}</td><td>${dt(x.ends_at)}${x.revoked ? ' (revoked)' : ''}</td>
        <td>${x.revoked ? '' : `<button class="b d" data-rv="${x.id}">Revoke</button>`}</td></tr>`).join('') || '<tr><td colspan=6 class=muted>None</td></tr>'}</table>
      <h3>Subscriptions</h3><table><tr><th>ID</th><th>Product</th><th>Status</th><th>Current end</th></tr>
      ${d.subscriptions.map((s) => `<tr><td class="mono">${esc(s.id)}</td><td>${esc(s.product_code)}</td><td>${esc(s.status)}</td><td>${dt(s.current_end)}</td></tr>`).join('') || '<tr><td colspan=4 class=muted>None</td></tr>'}</table>
      <h3>Payments</h3><table><tr><th>When</th><th>Product</th><th>Amount</th><th>Razorpay</th></tr>
      ${d.payments.map((p) => `<tr><td>${dt(p.created_at)}</td><td>${esc(p.product_code)}</td><td>${rupees(p.amount_paise || 0)}</td><td class="mono">${esc(p.razorpay_id)}</td></tr>`).join('') || '<tr><td colspan=4 class=muted>None</td></tr>'}</table>
      <h3>Usage (30 days)</h3><table><tr><th>Day</th><th>DMs</th></tr>${d.usage.map((u) => `<tr><td>${u.day}</td><td>${u.count}</td></tr>`).join('')}</table>`;
    $('#back').onclick = () => Licenses();
    $('#grant').onclick = async () => { await api('POST', `/licenses/${key}/grant`, { kind: $('#gk').value, hours: $('#gh').value }); License(key); };
    $('#reset').onclick = async () => { await api('POST', `/licenses/${key}/reset-usage`); License(key); };
    $('#ban').onclick = async () => { await api('POST', `/licenses/${key}/ban`, { banned: !l.banned }); License(key); };
    document.querySelectorAll('[data-rv]').forEach((b) => (b.onclick = async () => { await api('POST', `/entitlements/${b.dataset.rv}/revoke`); License(key); }));
  }

  async function Products() {
    const d = await api('GET', '/products');
    const form = (p = {}) => `<div class="card" style="margin-bottom:12px"><div class="form" data-code="${esc(p.code || '')}">
      <label>Code</label><input name="code" value="${esc(p.code || '')}" ${p.code ? 'readonly' : ''} placeholder="pro_month"/>
      <label>Name</label><input name="name" value="${esc(p.name || '')}"/>
      <label>Kind</label><select name="kind"><option ${p.kind === 'subscription' ? 'selected' : ''}>subscription</option><option ${p.kind === 'pass' ? 'selected' : ''}>pass</option></select>
      <label>Price (paise)</label><input name="price_paise" type="number" value="${p.price_paise ?? ''}"/>
      <label>Currency</label><input name="currency" value="${esc(p.currency || 'INR')}"/>
      <label>Interval label</label><input name="interval_label" value="${esc(p.interval_label || '')}" placeholder="month / year"/>
      <label>Pass hours</label><input name="duration_hours" type="number" value="${p.duration_hours ?? ''}"/>
      <label>Razorpay plan id</label><input name="razorpay_plan_id" value="${esc(p.razorpay_plan_id || '')}" placeholder="plan_XXXX (subscriptions only)"/>
      <label>Features (one per line)</label><textarea name="features">${esc(JSON.parse(p.features || '[]').join('\n'))}</textarea>
      <label>Sort</label><input name="sort" type="number" value="${p.sort ?? 0}"/>
      <label>Active</label><input name="active" type="checkbox" ${p.active === 0 ? '' : 'checked'}/>
      <span></span><div><button class="b p save">Save</button></div></div></div>`;
    $('#view').innerHTML = `<h2>Products</h2><p class="muted">Subscriptions need a Razorpay plan id (Dashboard → Subscriptions → Plans). Passes are sold through payment links.</p>
      ${d.products.map(form).join('')}<h3>Add product</h3>${form()}`;
    document.querySelectorAll('.save').forEach((b) => (b.onclick = async () => {
      const f = b.closest('.form');
      const v = (n) => f.querySelector(`[name=${n}]`);
      const code = v('code').value.trim();
      await api('PUT', '/products/' + code, {
        name: v('name').value, kind: v('kind').value, price_paise: v('price_paise').value, currency: v('currency').value,
        interval_label: v('interval_label').value || null, duration_hours: v('duration_hours').value || null,
        razorpay_plan_id: v('razorpay_plan_id').value || null, features: v('features').value.split('\n').map((s) => s.trim()).filter(Boolean),
        sort: v('sort').value, active: v('active').checked,
      });
      Products();
    }));
  }

  async function Notices() {
    const d = await api('GET', '/notices');
    $('#view').innerHTML = `<h2>In-app notices</h2><p class="muted">The newest active notice for the user's version and language pops up once inside the extension.</p>
      <div class="card"><div class="form" id="nf">
        <label>Title</label><input name="title"/><label>Body</label><textarea name="body"></textarea>
        <label>Link URL</label><input name="link_url"/><label>Link label</label><input name="link_label"/>
        <label>Level</label><select name="level"><option>info</option><option>warning</option><option>critical</option></select>
        <label>Language</label><select name="lang"><option value="">All</option><option value="en">English</option><option value="hi">Hindi</option></select>
        <label>Min version</label><input name="min_version" placeholder="1.0.0"/><label>Max version</label><input name="max_version"/>
        <span></span><div><button class="b p" id="nadd">Publish notice</button></div></div></div>
      <h3>All notices</h3><table><tr><th>When</th><th>Title</th><th>Level</th><th>Lang</th><th>Active</th><th></th></tr>
      ${d.notices.map((n) => `<tr><td>${dt(n.created_at)}</td><td>${esc(n.title)}</td><td>${n.level}</td><td>${n.lang || 'all'}</td><td>${n.active ? 'yes' : 'no'}</td>
        <td><button class="b" data-tg="${n.id}">${n.active ? 'Turn off' : 'Turn on'}</button> <button class="b d" data-del="${n.id}">Delete</button></td></tr>`).join('')}</table>`;
    $('#nadd').onclick = async () => {
      const b = {}; $('#nf').querySelectorAll('[name]').forEach((i) => (b[i.name] = i.value || null));
      await api('POST', '/notices', b); Notices();
    };
    document.querySelectorAll('[data-tg]').forEach((btn) => (btn.onclick = async () => {
      const n = d.notices.find((x) => String(x.id) === btn.dataset.tg); await api('PUT', '/notices/' + n.id, { ...n, active: !n.active }); Notices();
    }));
    document.querySelectorAll('[data-del]').forEach((btn) => (btn.onclick = async () => { await api('DELETE', '/notices/' + btn.dataset.del); Notices(); }));
  }

  async function Settings() {
    const { settings: s } = await api('GET', '/settings');
    $('#view').innerHTML = `<h2>Settings</h2><div class="card"><div class="form">
      <label>Free DMs per day</label><input id="s1" type="number" value="${esc(s.free_daily_limit)}"/>
      <label>Daily cap per IG account</label><input id="s2" type="number" value="${esc(s.pro_daily_cap)}"/>
      <label>Pass offered at limit</label><input id="s3" value="${esc(s.pass_offer_code)}" placeholder="product code, blank = none"/>
      <span></span><div><button class="b p" id="ss">Save</button></div></div></div>`;
    $('#ss').onclick = async () => { await api('PUT', '/settings', { free_daily_limit: $('#s1').value, pro_daily_cap: $('#s2').value, pass_offer_code: $('#s3').value }); Settings(); };
  }

  async function Payments() {
    const d = await api('GET', '/payments');
    $('#view').innerHTML = `<h2>Payments</h2><table><tr><th>When</th><th>License</th><th>Product</th><th>Amount</th><th>Event</th><th>Razorpay id</th></tr>
      ${d.payments.map((p) => `<tr><td>${dt(p.created_at)}</td><td class="mono">${esc((p.license_key || '').slice(0, 14))}…</td><td>${esc(p.product_code)}</td>
        <td>${rupees(p.amount_paise || 0)}</td><td>${esc(p.event)}</td><td class="mono">${esc(p.razorpay_id)}</td></tr>`).join('') || '<tr><td colspan=6 class=muted>No payments yet</td></tr>'}</table>`;
  }

  boot();
})();
</script>
</body>
</html>
